# oss-compliance-auditor triage ledger.
#
# Each entry records a human (or, where permitted, agent) decision about one
# finding.  Entries are keyed by finding_id, which is derived from the rule, the
# path and the normalised evidence -- NOT the line number, so decisions survive
# edits elsewhere in the file.
#
# A decision is honoured only if all of these hold:
#   * decision is one of the values allowed by policy (triage.valid_decisions)
#   * rationale is present and meaningful
#   * evidence_sha still matches the finding's current evidence
#   * expires is in the future
#   * an approver is named, for severities listed in triage.require_approver_for
#   * the finding is not in a category an agent may not clear (when reviewer_type
#     is 'agent')
#
# Anything else leaves the finding open and is reported as a ledger problem.
# Do not hand-edit finding_id or evidence_sha: changing them to force a match
# defeats the control and is visible in this file's own git history.
