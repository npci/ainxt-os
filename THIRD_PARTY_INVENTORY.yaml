# ---------------------------------------------------------------------------------------------
# Bundled (vendored) non-Rust components. Unlike the crates above - which resolve from crates.io
# against the committed Cargo.lock - these ship as SOURCE in this repository, so their notices are
# a redistribution obligation. `cargo deny` audits the Cargo graph only and cannot see JavaScript,
# so this section is the record for that ecosystem. Full licence texts: THIRD_PARTY_NOTICES.md.
# ---------------------------------------------------------------------------------------------
bundled:
  - name: DOMPurify
    version: "3.2.6"
    license: "Apache-2.0 OR MPL-2.0"
    repo: https://github.com/cure53/DOMPurify
    path: docs/vendor/purify.min.js
    usage: documentation-viewer
    modified: false
    note: >-
      Sanitizes all HTML produced by marked before it is written to the DOM, preventing XSS
      (Checkmarx: Client Potential XSS; OWASP A3 / PCI DSS 6.5.7). Redistributed unmodified.
  - name: marked
    version: "11.0.0"
    license: "MIT"
    repo: https://github.com/markedjs/marked
    path: docs/vendor/marked.min.js
    usage: documentation-viewer
    modified: false
  - name: mermaid
    version: "11.9.0"
    license: "MIT"
    repo: https://github.com/mermaid-js/mermaid
    path: docs/vendor/mermaid.min.js
    usage: documentation-viewer
    modified: false
    note: >-
      The distributed bundle embeds further MIT-licensed components (a Promises/A+ thenable,
      a jQuery-derived event object, a Bezier generator, lodash) whose notices are retained
      inside the file. DOMPurify is NOT among these embedded MIT components -- it is separately
      vendored and inventoried above as its own entry, under Apache-2.0/MPL-2.0. Redistributed
      unmodified.

# NOTE ON COMPLETENESS: as of the 2026-09-05 remediation pass, the crate list above enumerates
# ALL 323 unique external crate names that the committed Cargo.lock resolves (417 total packages:
# 65 workspace ainxt-* crates + 352 external package instances across those 323 names). `cargo
# deny check` gates the FULL graph on licences, advisories, bans and sources, so nothing was ever
# unreviewed at the dependency-gate level -- this file previously just didn't list every crate the
# gate was already checking. This is still not a full SBOM (no supply-chain metadata beyond
# name/version/license/repo, and it is not machine-regenerated on every build); generating one
# (CycloneDX/SPDX) from the lockfile remains tracked as release-readiness work.
# Total: 331 crate name/version rows (323 unique external crate names, 8 resolved at two
# coexisting versions) + 3 bundled JavaScript components (Cargo.lock: 417 total / 352 external)
