[package]
name = "ainxt-artifact"
version = "0.0.0"
publish = false
description = "AiNxt runtime — the artifact (document-generation) runtime (Phase 3). Documents are built as a structured, model-agnostic intermediate representation (headings/paragraphs/lists/tables/code/page-breaks); a Renderer turns the IR into a concrete format (built-in Markdown + plain text; docx/pptx/pdf/xlsx are skill renderers behind the same seam). Compliance here is AUDIT-and-proceed, never redact: redacting inside a document — especially a code block or table — corrupts it, so findings are recorded and the content is emitted intact."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# ainxt-types by path for the shared Principal + capability-based RBAC model (ADR-012). The
# document-generation surface is capability-gated (`artifact.generate`) exactly like the ledger
# (nl2sql) and graph surfaces, so one authenticated Principal drives every non-chat route. Path dep,
# permissive-only; NOTHING copyleft enters the supply-chain surface.
ainxt-types = { path = "../ainxt-types" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
