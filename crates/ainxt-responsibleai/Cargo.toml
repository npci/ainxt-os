[package]
name = "ainxt-responsibleai"
version = "0.0.0"
publish = false
description = "AiNxt runtime — Responsible-AI governance (gap D; ADR-011): the AI-specific control-plane artifacts a payments regulator (RBI, EU-AI-Act-style) demands. Deterministic, pure core: MODEL CARDS + SYSTEM CARDS with structural validation, BIAS/FAIRNESS disparity computation (rate-ratio / rate-difference, four-fifths style) that names the worst-off group pair, and a fail-closed DEPLOY GATE binding a card + a bias check + an approver — a deployment is refused if the card is invalid, the risk class is Unacceptable, the model is biased beyond threshold, or the approver lacks authority. No clock/rng/I/O in the logic; the gate is exhaustively testable so it can be trusted to actually block."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Permissive-only. serde for (de)serializable cards/reports/records (control-plane definition
# content, stored under ADR-026 git governance); ainxt-types by path for the shared `Principal`
# (the approver whose RBAC authority the deploy gate checks).
serde = { version = "1", features = ["derive"] }
ainxt-types = { path = "../ainxt-types" }
# Cryptographic hash for content-addressed control-plane artifacts: the DPIA content-hash (a change
# to data-class-ceiling/capabilities/purpose invalidates approval) and the sub-processor TOFU list
# pin. RustCrypto, MIT/Apache-2.0 dual-licensed, already in the workspace tree — no new license surface.
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
