[package]
name = "ainxt-protocol"
version = "0.0.0"
publish = false
description = "AiNxt runtime — the versioned command/event contract (see PROTOCOL.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ainxt-types = { path = "../ainxt-types" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
