[package]
name = "ainxt-guardrails"
version = "0.0.0"
publish = false
description = "AiNxt runtime — configurable input/output rails (jailbreak/groundedness/toxicity), ADR-008. DEFAULT OFF; opt-in per deployment so it never double-processes the Python gateway during coexistence."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ainxt-injection = { path = "../ainxt-injection" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
