[package]
name = "ainxt-oauth"
version = "0.0.0"
publish = false
description = "AiNxt runtime — OAuth2 authorization-code + PKCE engine (Phase 2). Transport-AGNOSTIC pure core: PKCE (S256) generation, authorize-URL construction, token-exchange/refresh request descriptors, token-response parsing, and incremental-consent detection. No I/O — the connector transport (#5) executes the HTTP; this crate stays pure and exhaustively testable."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# SHA-256 for the PKCE S256 code challenge (RustCrypto, MIT/Apache-2.0).
sha2 = "0.11"
# OS CSPRNG for the PKCE verifier + CSRF state (MIT/Apache-2.0).
getrandom = "0.2"
# RFC3986 percent-encoding for authorize-URL query params (MIT/Apache-2.0).
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
