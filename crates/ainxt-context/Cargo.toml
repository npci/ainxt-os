[package]
name = "ainxt-context"
version = "0.0.0"
publish = false
description = "AiNxt runtime — Context Fabric: data-class-filtered retrieval, context assembly, and citations (ADR-012; CONTEXT_FABRIC.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
ainxt-types = { path = "../ainxt-types" }
ainxt-injection = { path = "../ainxt-injection" }
# The production hybrid retriever (BM25 + dense + RRF + rerank, with pre-rank ACL) lives in
# ainxt-retrieval; ainxt-context adapts it behind the `Retriever` seam so the live path can use
# the real engine, not the lexical placeholder. Permissive path dep only.
ainxt-retrieval = { path = "../ainxt-retrieval" }
# The numeric-claim contract + server-side re-derivation gate (never trust model arithmetic) lives
# in ainxt-synthesis; ainxt-context re-exports it and drives it on the compile/verify path so the
# same window that grounded the answer also verifies the answer's numbers. Acyclic path dep only
# (ainxt-synthesis depends on nothing in this crate).
ainxt-synthesis = { path = "../ainxt-synthesis" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
