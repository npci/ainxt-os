[package]
name = "ainxt-cache"
version = "0.0.0"
publish = false
description = "AiNxt runtime — response cache: exact + normalized-key + SEMANTIC (embedding-similarity) lookup with logical-tick TTL and LRU eviction (gap I: semantic/prompt caching). Deterministic and std-only; embeddings are accepted precomputed (the embed service is the seam), so the cache logic is exhaustively testable with no ML runtime and no clock."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
