[package]
name = "ainxt-injection"
version = "0.0.0"
publish = false
description = "AiNxt runtime — agentic security: prompt-injection defense (ADR-009). Trust/provenance model, instruction/data separation, injection detection + capability gating for UNTRUSTED content (RAG/tools/connectors). DEFAULT OFF; config opt-in."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
