[package]
name = "ainxt-answer"
version = "0.0.0"
publish = false
description = "AiNxt answer-composition + presentation core (gaps BK/BM/BN): a typed chat-answer model (lead + ordered sections + inline citations + code/table segments), VERBOSITY calibration that right-sizes an answer to a reasoning-depth hint (so a trivial follow-up is not an essay and a deep analysis is not truncated), CITATION UX (first-appearance dedup+numbering, references list, dangling/uncited detection), and deterministic Markdown + plain-text rendering. Distinct from ainxt-artifact (renders generated DOCUMENTS) and ainxt-prompt (assembles model INPUT); this shapes the chat OUTPUT."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Permissive-only deps. serde for a (de)serializable answer model; ainxt-types by path for the
# shared Tier reasoning-depth hint that drives verbosity calibration. NOTHING copyleft; rendering
# is pure string work, so no templating/markdown crates enter the supply-chain surface here.
[dependencies]
serde = { version = "1", features = ["derive"] }
ainxt-types = { path = "../ainxt-types" }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
