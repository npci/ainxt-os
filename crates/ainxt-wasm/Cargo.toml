[package]
name = "ainxt-wasm"
version = "0.0.0"
publish = false
description = "AiNxt runtime — capability-confined WASM plugin sandbox (ADR-024). Runs untrusted plugin code on wasmtime with ZERO ambient authority (no WASI, no host imports — a module that imports anything ungranted FAILS to instantiate) and hard resource ceilings (fuel-metered execution, a StoreLimits memory cap, and an output-size cap). Fuel exhaustion (e.g. an infinite loop) surfaces as a bounded trap (OutOfFuel), never a hang; a wasm trap/panic is isolated as Trapped so the host survives; a memory.grow past the cap fails cleanly. Depends on wasmtime 27 (Apache-2.0 WITH LLVM-exception — the deny.toml license exception is already reviewed) with the 'wat' feature so inline WAT can be loaded in tests without external .wasm files."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# WebAssembly runtime. License: Apache-2.0 WITH LLVM-exception. The corresponding deny.toml
# exception is already in place.
#
# The SPDX identifier above is the statement of record. An earlier comment here characterised
# the LLVM exception as "strictly more permissive than Apache-2.0, never copyleft" — that is a
# licence comparison, i.e. a legal conclusion, and a build manifest is the wrong place to assert
# one. Removed: `deny.toml` is where the licence policy decision belongs, and counsel is where
# the comparison belongs. The "wat" feature lets Module::new accept
# inline WebAssembly text so the tests carry their fixtures inline (no external binaries).
# Pinned to >=43.0.1: earlier lines carry unpatched RUSTSEC advisories (the 2026 set needs v42+),
# caught by `cargo deny`. License: Apache-2.0 WITH LLVM-exception (permissive; deny exception added).
#
# default-features = false + a minimal set: the default `component-model` feature pulls `wasm-compose`
# → `im-rc`/`sized-chunks`/`bitmaps`, which are MPL-2.0 (weak copyleft) and violate the permissive-only
# gate. This sandbox only runs CORE wasm modules (no component model), so dropping that feature keeps
# the whole tree permissive with zero loss of function. We keep: std, runtime (Store/Instance/Func),
# cranelift (compile), wat (inline-WAT fixtures), gc (Val), addr2line/demangle (readable traps).
wasmtime = { version = "48.0.1", default-features = false, features = ["std", "runtime", "cranelift", "wat", "addr2line", "demangle"] }
# The capability-confinement SEAM (PluginHost / ResourceLimits / PluginError). This crate is the real
# WASM implementation of that offline-defined contract, so `WasmSandbox` drops in behind the same trait
# `NativeHost` implements — one seam, two hosts. ainxt-plugin has no wasm dependency (serde + sha2 only),
# so the edge is acyclic. MIT/Apache workspace-internal, no new license surface.
ainxt-plugin = { path = "../ainxt-plugin" }

[lints.rust]
unsafe_code = "forbid"
