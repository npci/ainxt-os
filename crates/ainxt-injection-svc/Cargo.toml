[package]
name = "ainxt-injection-svc"
version = "0.0.0"
publish = false
description = "AiNxt runtime — HTTP sidecar exposing the ADR-009 prompt-injection detector (scan + instruction/data fencing) to non-Rust callers. Stateless, no model, no provider, no database."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "ainxt-injection-svc"
path = "src/main.rs"

[dependencies]
# The detector itself. This crate is a transport shim over it and deliberately holds no
# detection logic of its own — the scoring lives in ONE place, in Rust, with its own tests.
ainxt-injection  = { path = "../ainxt-injection" }
ainxt-guardrails = { path = "../ainxt-guardrails" }
ainxt-compliance = { path = "../ainxt-compliance" }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex-lite = "0.1"
tokio = { workspace = true, features = ["net", "signal", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
futures = "0.3"

[lints.rust]
unsafe_code = "forbid"
