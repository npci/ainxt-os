═══ SAFE — this is INFORMATION being reported (allow) ═══
- Directory listings, file trees, `ls`/`dir` output, file contents, source code
- Logs, stack traces, error messages, exit codes, build/test output
- Command output, API responses, database query results, config dumps
- Data that merely CONTAINS sensitive-looking strings — filenames like
