[package]
name = "ainxt-connector"
version = "0.0.0"
publish = false
description = "AiNxt runtime — Connector Runtime (Phase 2). Server-side connector catalog + policy with MANDATORY safety seams (on-behalf-of authz, egress DLP, data-class enforcement, audit). OAuth/token/transport land in later increments; this crate is the policy spine every outbound connector call flows through."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ainxt-types = { path = "../ainxt-types" }
ainxt-injection = { path = "../ainxt-injection" }
serde = { version = "1", features = ["derive"] }
# SHA-256 for the tamper-evident audit hash chain (RustCrypto, MIT/Apache-2.0; already cleared by the
# deny license gate and used by ainxt-oauth).
sha2 = "0.11"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
